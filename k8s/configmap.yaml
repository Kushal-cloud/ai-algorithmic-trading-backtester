apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: trading
data:
  APP_ENV: "production"
  DEFAULT_TICKER: "AAPL"
  DEFAULT_PERIOD: "5y"
  DEFAULT_ASSET_CLASS: "us_stocks"
  INITIAL_CAPITAL: "100000"
  RISK_PER_TRADE: "0.01"
  TRANSACTION_COST_BPS: "5"
  SLIPPAGE_BPS: "2"
  STOP_LOSS_PCT: "0.02"
  TAKE_PROFIT_PCT: "0.04"
  USE_ICT_FILTER: "true"
