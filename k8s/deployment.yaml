apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-dashboard
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-dashboard
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trading-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/YOUR_GITHUB_USERNAME/ai-trading-backtester:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: trading-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
